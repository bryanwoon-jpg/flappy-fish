<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02030f">
<meta name="description" content="A neon deep sea flapper. Tap to swim, dodge the coral, grab the pearls.">
<title>Neon Reef</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neon Reef">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/press-start-2p-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:'Orbitron';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/orbitron-latin-500-normal.woff2) format('woff2')}
  @font-face{font-family:'Orbitron';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/orbitron-latin-700-normal.woff2) format('woff2')}
  html,body{margin:0;height:100%;background:#02030f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;font-family:'Orbitron',system-ui,sans-serif;color:#e8fbff}
  #wrap{--u:1;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(60,242,255,.12)}
  canvas{display:block}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--u)*14px);pointer-events:none;text-align:center;padding:calc(var(--u)*24px);box-sizing:border-box;z-index:3}
  .overlay.top{justify-content:flex-start;padding-top:calc(var(--u)*96px + env(safe-area-inset-top,0px))}
  .hidden{display:none!important}
  .px{font-family:'Press Start 2P',monospace}
  .logo{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*46px);line-height:1.3;display:flex;flex-direction:column;
    color:#fff;text-shadow:0 0 6px #3cf2ff,0 0 18px #3cf2ff,0 0 38px #00b3ff}
  .logo span:last-child{text-shadow:0 0 6px #ff2bd6,0 0 18px #ff2bd6,0 0 38px #c400ff}
  .logo.small{font-size:calc(var(--u)*30px)}
  .tag{font-size:calc(var(--u)*12px);letter-spacing:.32em;text-transform:uppercase;color:#9fdcff;opacity:.85}
  .best{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*13px);color:#ffd23f;text-shadow:0 0 10px rgba(255,210,63,.7)}
  .spacer{flex:1}
  .hint{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*16px);color:#fff;text-shadow:0 0 10px #3cf2ff,0 0 22px #3cf2ff}
  .pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35;transform:scale(.96)}}
  .keys{font-size:calc(var(--u)*11px);color:#8fb8d8;letter-spacing:.08em;line-height:1.7}
  .menuKeys{margin-bottom:calc(var(--u)*92px)}
  .go{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*26px);color:#fff;text-shadow:0 0 8px #ff2bd6,0 0 24px #ff2bd6}
  .panel{display:flex;align-items:center;gap:calc(var(--u)*20px);padding:calc(var(--u)*18px) calc(var(--u)*22px);
    border:2px solid rgba(60,242,255,.8);border-radius:calc(var(--u)*16px);background:rgba(4,8,30,.8);
    box-shadow:0 0 18px rgba(60,242,255,.45),inset 0 0 22px rgba(60,242,255,.15)}
  .medalBox{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8px);font-size:calc(var(--u)*10px);letter-spacing:.15em;color:#bfe9ff}
  .medal{--c:#34456b;width:calc(var(--u)*76px);height:calc(var(--u)*76px);border-radius:50%;border:3px solid var(--c);
    box-shadow:0 0 16px var(--c),inset 0 0 16px var(--c);display:grid;place-items:center;box-sizing:border-box}
  .medal svg{width:55%;height:55%;fill:var(--c);filter:drop-shadow(0 0 6px var(--c))}
  .medal.none{border-style:dashed;box-shadow:none}
  .medal.none svg{opacity:.35;filter:none}
  .medal.bronze{--c:#ff9a4d}.medal.silver{--c:#d6e6ff}.medal.gold{--c:#ffd23f}.medal.platinum{--c:#7df9ff}
  .medal.pop{animation:medalPop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes medalPop{0%{transform:scale(.2) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
  .stats{display:flex;flex-direction:column;gap:calc(var(--u)*10px)}
  .stats div{display:flex;flex-direction:column;align-items:flex-end;position:relative}
  .stats label{font-size:calc(var(--u)*10px);letter-spacing:.2em;color:#8fb8d8}
  .stats b{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*20px);color:#fff;text-shadow:0 0 8px #3cf2ff;margin-top:calc(var(--u)*4px)}
  .new{position:absolute;right:calc(100% + 8px);bottom:0;font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*8px);
    background:#ff2bd6;color:#fff;padding:4px 5px;border-radius:4px;box-shadow:0 0 10px #ff2bd6;white-space:nowrap}
  .btn{pointer-events:auto;font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*14px);color:#02030f;background:#3cf2ff;border:0;
    border-radius:calc(var(--u)*14px);padding:calc(var(--u)*18px) calc(var(--u)*26px);min-height:52px;cursor:pointer;touch-action:manipulation;
    box-shadow:0 0 20px #3cf2ff,0 0 44px rgba(60,242,255,.5);transition:transform .08s,opacity .2s}
  .btn:active{transform:scale(.95)}
  .btn:disabled{opacity:.45}
  .btn.small{font-size:calc(var(--u)*11px);padding:calc(var(--u)*12px) calc(var(--u)*18px);min-height:44px;background:transparent;color:#bff8ff;border:2px solid #3cf2ff;box-shadow:0 0 14px rgba(60,242,255,.45)}
  .ios{color:#bfe9ff}
  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top,0px)) 12px 12px;pointer-events:none;z-index:5}
  .icon{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(60,242,255,.6);background:rgba(4,8,30,.55);
    display:grid;place-items:center;color:#bff8ff;cursor:pointer;box-shadow:0 0 10px rgba(60,242,255,.35);padding:0;touch-action:manipulation}
  .icon svg{width:22px;height:22px}
  #pauseBtn{visibility:hidden}
  body[data-state="play"] #pauseBtn{visibility:visible}
  #muteBtn .off{display:none}
  #muteBtn.muted .on{display:none}
  #muteBtn.muted .off{display:block}
</style>
</head>
<body data-state="menu">
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="hud">
    <button id="pauseBtn" class="icon" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button id="muteBtn" class="icon" aria-label="Toggle sound">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>

  <div id="menu" class="overlay top">
    <div class="logo"><span>NEON</span><span>REEF</span></div>
    <div class="tag">A deep sea flapper</div>
    <div class="best">BEST <span id="menuBest">0</span></div>
    <div class="spacer"></div>
    <div class="hint pulse">TAP TO SWIM</div>
    <button id="installBtn" class="btn small hidden">INSTALL APP</button>
    <div id="iosHint" class="keys ios hidden">To install: tap Share, then<br>"Add to Home Screen"</div>
    <div class="keys menuKeys">Space, ↑ or click on desktop<br>Grab glowing pearls for +2</div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="logo small">PAUSED</div>
    <div class="hint pulse">TAP TO RESUME</div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="go">GAME OVER</div>
    <div class="panel">
      <div class="medalBox">
        <div id="medal" class="medal none">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.9 5.9 20.4l1.5-6.8L2.2 9l6.9-.7z"/></svg>
        </div>
        <div id="medalName">NO MEDAL</div>
      </div>
      <div class="stats">
        <div><label>SCORE</label><b id="sScore">0</b></div>
        <div><label>BEST</label><b id="sBest">0</b><span id="newTag" class="new hidden">NEW</span></div>
        <div><label>PEARLS</label><b id="sPearls">0</b></div>
      </div>
    </div>
    <div id="nextHint" class="keys"></div>
    <button id="retry" class="btn">PLAY AGAIN</button>
  </div>
</div>

<script>
(() => {
  // ---------- Tuning (classic hard) ----------
  const H = 640, GROUND = 72, PIPE_W = 64, GAP = 128, SPACING = 220;
  const SPEED = 150, G = 1700, FLAP = -470, MAX_FALL = 720, R = 12;
  const PEARL_CHANCE = 0.45, PEARL_POINTS = 2;
  const MEDALS = [
    { min: 40, cls: 'platinum', name: 'PLATINUM' },
    { min: 30, cls: 'gold', name: 'GOLD' },
    { min: 20, cls: 'silver', name: 'SILVER' },
    { min: 10, cls: 'bronze', name: 'BRONZE' },
  ];

  // ---------- DOM ----------
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  const $ = id => document.getElementById(id);
  const menuEl = $('menu'), pauseEl = $('pause'), overEl = $('over');
  const retryBtn = $('retry'), muteBtn = $('muteBtn'), pauseBtn = $('pauseBtn');

  // ---------- Storage (safe) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = parseInt(store.get('neonReefBest', '0'), 10) || 0;
  let muted = store.get('neonReefMuted', '0') === '1';
  $('menuBest').textContent = best;
  muteBtn.classList.toggle('muted', muted);

  // ---------- Audio (synthesised) ----------
  let ac = null;
  function ensureAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  }
  function tone(freq, dur, type = 'sine', vol = 0.12, slideTo = null, delay = 0) {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol) {
    if (muted || !ac) return;
    const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = b;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(ac.destination); s.start();
  }
  const sfx = {
    flap() { tone(260, 0.13, 'sine', 0.14, 640); },
    score() { tone(880, 0.07, 'square', 0.05); tone(1320, 0.12, 'square', 0.05, null, 0.07); },
    pearl() { [1046, 1318, 1568, 2093].forEach((f, i) => tone(f, 0.11, 'triangle', 0.08, null, i * 0.045)); },
    hit() { noise(0.35, 0.35); tone(200, 0.45, 'sawtooth', 0.1, 45); },
    medal() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.09, null, 0.15 + i * 0.09)); }
  };

  // ---------- Sizing ----------
  let W = 360;
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let scale = vh / H; W = vw / scale;
    if (W > 480) W = 480;
    if (W < 280) { W = 280; scale = vw / 280; }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = Math.round(W * scale), ch = Math.round(H * scale);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    wrap.style.setProperty('--u', scale.toFixed(4));
    if (state !== 'play' && state !== 'dead') fish.x = W * 0.3;
  }

  // ---------- State ----------
  let state = 'menu', paused = false, t = 0, scroll = 0;
  let score = 0, pearlsGot = 0, deadTimer = 0, shake = 0, flash = 0, nextGapY = 300, overShown = false;
  const fish = { x: 100, y: H * 0.42, vy: 0, rot: 0 };
  let pipes = [], pearls = [], parts = [], pops = [];
  const plankton = Array.from({ length: 46 }, () => ({
    x: Math.random() * 480, y: Math.random() * H, r: Math.random() * 1.6 + 0.4,
    s: Math.random() * 12 + 4, p: Math.random() * 0.5 + 0.15, ph: Math.random() * 6
  }));

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hash = i => { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); };
  const gapMin = 70 + GAP / 2, gapMax = H - GROUND - 70 - GAP / 2;

  function setState(s) { state = s; document.body.dataset.state = s; }

  function reset() {
    pipes = []; pearls = []; pops = [];
    score = 0; pearlsGot = 0; deadTimer = 0; overShown = false;
    fish.x = W * 0.3; fish.y = H * 0.42; fish.vy = 0; fish.rot = 0;
    nextGapY = rand(gapMin, gapMax);
  }

  function addPipe(x) {
    const gy = nextGapY; nextGapY = rand(gapMin, gapMax);
    pipes.push({ x, gy, scored: false });
    if (Math.random() < PEARL_CHANCE) {
      const py = clamp((gy + nextGapY) / 2 + rand(-55, 55), 50, H - GROUND - 40);
      pearls.push({ x: x + PIPE_W + (SPACING - PIPE_W) / 2, y: py, cy: py, ph: Math.random() * 6 });
    }
  }

  function flap() {
    fish.vy = FLAP; sfx.flap();
    for (let i = 0; i < 3; i++) parts.push({
      x: fish.x - 14, y: fish.y + rand(-4, 4), vx: rand(-50, -20), vy: rand(-60, -20),
      life: 0, max: rand(0.5, 0.9), r: rand(2, 4.5), type: 'bubble'
    });
  }

  function startPlay() { setState('play'); menuEl.classList.add('hidden'); flap(); }

  function die() {
    setState('dead'); deadTimer = 0; shake = 10; flash = 1; sfx.hit();
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2, sp = rand(60, 260);
      parts.push({ x: fish.x, y: fish.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: rand(0.4, 0.9),
        r: rand(1.5, 3.5), type: 'spark', col: Math.random() < 0.5 ? '#ffd23f' : '#ff8a3d' });
    }
    if (fish.vy < 0) fish.vy = 0;
  }

  function gameOver() {
    overShown = true; setState('over');
    const isNew = score > best;
    if (isNew) { best = score; store.set('neonReefBest', String(best)); }
    $('sScore').textContent = score; $('sBest').textContent = best; $('sPearls').textContent = pearlsGot;
    $('menuBest').textContent = best;
    $('newTag').classList.toggle('hidden', !isNew);
    const m = MEDALS.find(x => score >= x.min);
    const medalEl = $('medal');
    medalEl.className = 'medal ' + (m ? m.cls + ' pop' : 'none');
    $('medalName').textContent = m ? m.name : 'NO MEDAL';
    const next = [...MEDALS].reverse().find(x => score < x.min);
    $('nextHint').textContent = next ? `Score ${next.min} for ${next.name.charAt(0) + next.name.slice(1).toLowerCase()}` : 'Top tier reached. Legend of the reef!';
    if (m) sfx.medal();
    overEl.classList.remove('hidden');
    retryBtn.disabled = true;
    setTimeout(() => { retryBtn.disabled = false; }, 550);
  }

  function retry() {
    if (retryBtn.disabled) return;
    ensureAudio();
    overEl.classList.add('hidden');
    reset(); setState('ready');
  }

  function setPaused(p) {
    if (state !== 'play') p = false;
    paused = p; pauseEl.classList.toggle('hidden', !p);
  }

  // ---------- Input ----------
  function press() {
    ensureAudio();
    if (state === 'menu') { const y = fish.y; reset(); fish.y = y; startPlay(); }
    else if (state === 'ready') { startPlay(); }
    else if (state === 'play') { if (paused) setPaused(false); else flap(); }
  }
  window.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); press();
  }, { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault(); if (e.repeat) return;
      if (state === 'over') retry(); else press();
    } else if (e.code === 'Enter' && state === 'over') { retry(); }
    else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') { setPaused(!paused); }
    else if (e.code === 'KeyM') { toggleMute(); }
  });
  retryBtn.addEventListener('click', retry);
  pauseBtn.addEventListener('click', () => setPaused(!paused));
  function toggleMute() {
    muted = !muted; store.set('neonReefMuted', muted ? '1' : '0');
    muteBtn.classList.toggle('muted', muted);
    if (!muted) { ensureAudio(); tone(660, 0.08, 'triangle', 0.08); }
  }
  muteBtn.addEventListener('click', toggleMute);
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
  window.addEventListener('blur', () => setPaused(true));
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  // ---------- Collision ----------
  function hitRect(cx, cy, r, x, y, w, h) {
    const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  // ---------- Update ----------
  function update(dt) {
    t += dt;
    if (paused) return;
    const moving = state === 'menu' || state === 'ready' || state === 'play';
    if (moving) scroll += SPEED * dt;

    for (const p of plankton) {
      if (moving) p.x -= SPEED * dt * p.p;
      p.y -= p.s * dt;
      if (p.x < -5) p.x += W + 10;
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
    }

    if (state === 'menu' || state === 'ready') {
      fish.y = (state === 'menu' ? H * 0.58 : H * 0.42) + Math.sin(t * 3) * 8; fish.rot = Math.sin(t * 3 + 1) * 0.08;
    } else if (state === 'play') {
      fish.vy = Math.min(fish.vy + G * dt, MAX_FALL);
      fish.y += fish.vy * dt;
      if (fish.y < R) { fish.y = R; if (fish.vy < 0) fish.vy = 0; }
      const target = clamp(fish.vy / 650, -0.5, 1.3);
      fish.rot += (target - fish.rot) * Math.min(1, dt * 12);

      for (const p of pipes) p.x -= SPEED * dt;
      for (const p of pearls) { p.x -= SPEED * dt; p.cy = p.y + Math.sin(t * 2 + p.ph) * 4; }
      pipes = pipes.filter(p => p.x > -PIPE_W - 20);
      pearls = pearls.filter(p => p.x > -30 && !p.got);
      if (!pipes.length) addPipe(W + 110);
      while (pipes[pipes.length - 1].x + SPACING <= W + PIPE_W) addPipe(pipes[pipes.length - 1].x + SPACING);

      for (const p of pipes) {
        if (!p.scored && p.x + PIPE_W / 2 < fish.x) { p.scored = true; score++; sfx.score(); }
      }
      for (const p of pearls) {
        if (!p.got && (p.x - fish.x) ** 2 + (p.cy - fish.y) ** 2 < (R + 11) ** 2) {
          p.got = true; score += PEARL_POINTS; pearlsGot++; sfx.pearl();
          pops.push({ x: p.x, y: p.cy - 10, text: '+' + PEARL_POINTS, life: 0 });
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2;
            parts.push({ x: p.x, y: p.cy, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: 0, max: 0.45, r: 2, type: 'spark', col: '#7df9ff' });
          }
        }
      }

      if (fish.y + R >= H - GROUND) { fish.y = H - GROUND - R; die(); }
      else {
        for (const p of pipes) {
          const top = p.gy - GAP / 2, bot = p.gy + GAP / 2;
          if (hitRect(fish.x, fish.y, R, p.x, -50, PIPE_W, top + 50) ||
              hitRect(fish.x, fish.y, R, p.x - 5, top - 24, PIPE_W + 10, 24) ||
              hitRect(fish.x, fish.y, R, p.x, bot, PIPE_W, H - GROUND - bot) ||
              hitRect(fish.x, fish.y, R, p.x - 5, bot, PIPE_W + 10, 24)) { die(); break; }
        }
      }
    } else if (state === 'dead') {
      fish.vy = Math.min(fish.vy + G * dt, MAX_FALL);
      fish.y += fish.vy * dt;
      fish.rot += (1.5 - fish.rot) * Math.min(1, dt * 8);
      if (fish.y + R >= H - GROUND) { fish.y = H - GROUND - R; fish.vy = 0; deadTimer += dt; }
      if (deadTimer > 0.45 && !overShown) gameOver();
    }

    for (const p of parts) {
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'bubble') { p.vy -= 60 * dt; p.vx *= 0.96; } else { p.vx *= 0.92; p.vy *= 0.92; }
    }
    parts = parts.filter(p => p.life < p.max);
    for (const p of pops) { p.life += dt; p.y -= 40 * dt; }
    pops = pops.filter(p => p.life < 0.8);
    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt * 4);
  }

  // ---------- Render ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }

  function drawRays() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const cx = W * (0.12 + i * 0.27) + Math.sin(t * 0.25 + i * 1.7) * 30, w = 28 + (i % 2) * 26;
      const gr = ctx.createLinearGradient(0, 0, 0, H * 0.8);
      gr.addColorStop(0, 'rgba(120,200,255,0.09)'); gr.addColorStop(1, 'rgba(120,200,255,0)');
      ctx.fillStyle = gr; ctx.beginPath();
      ctx.moveTo(cx - w / 2, 0); ctx.lineTo(cx + w / 2, 0);
      ctx.lineTo(cx + w * 1.6 + 60, H * 0.8); ctx.lineTo(cx - w * 0.4 + 60, H * 0.8);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawPlankton() {
    for (const p of plankton) {
      const a = 0.25 + 0.25 * Math.sin(t * 2 + p.ph);
      ctx.fillStyle = `rgba(160,230,255,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
  }

  function drawFarReef() {
    const base = H - GROUND, off = scroll * 0.35;
    ctx.beginPath(); ctx.moveTo(0, base);
    for (let x = 0; x <= W + 8; x += 8) {
      const X = x + off;
      const y = base - 46 - Math.sin(X * 0.018) * 22 - Math.sin(X * 0.051 + 1) * 12 - Math.max(0, Math.sin(X * 0.007)) * 46;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, base); ctx.closePath();
    ctx.fillStyle = 'rgba(110,60,255,0.13)'; ctx.fill();
    ctx.strokeStyle = 'rgba(170,110,255,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  function pillar(x, y, w, h) {
    if (h <= 0) return;
    ctx.fillStyle = 'rgba(255,43,214,0.10)'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(255,43,214,0.28)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let yy = y + 26; yy < y + h - 4; yy += 26) { ctx.moveTo(x + 5, yy); ctx.lineTo(x + w - 5, yy); }
    ctx.moveTo(x + w * 0.3, y); ctx.lineTo(x + w * 0.3, y + h);
    ctx.stroke();
    ctx.save(); ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 14;
    ctx.strokeStyle = '#ff4fe0'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, w, h); ctx.restore();
  }
  function cap(x, y, w, h) {
    ctx.fillStyle = 'rgba(60,242,255,0.14)'; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.shadowColor = '#3cf2ff'; ctx.shadowBlur = 16;
    ctx.strokeStyle = '#5ff6ff'; ctx.lineWidth = 2.5; rr(x, y, w, h, 6); ctx.stroke(); ctx.restore();
  }
  function drawPipes() {
    for (const p of pipes) {
      const top = p.gy - GAP / 2, bot = p.gy + GAP / 2;
      pillar(p.x, -6, PIPE_W, top + 6); cap(p.x - 5, top - 24, PIPE_W + 10, 24);
      pillar(p.x, bot, PIPE_W, H - GROUND - bot + 4); cap(p.x - 5, bot, PIPE_W + 10, 24);
    }
  }

  function drawPearls() {
    for (const p of pearls) {
      if (p.got) continue;
      const pulse = 1 + Math.sin(t * 5 + p.ph) * 0.12, y = p.cy;
      ctx.save(); ctx.shadowColor = '#7df9ff'; ctx.shadowBlur = 18;
      const gr = ctx.createRadialGradient(p.x - 3, y - 3, 1, p.x, y, 10 * pulse);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.5, '#c8fbff'); gr.addColorStop(1, 'rgba(125,249,255,0.6)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, y, 9 * pulse, 0, 7); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(p.x, y); ctx.rotate(t * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.2; ctx.beginPath();
      ctx.moveTo(-16, 0); ctx.lineTo(-12, 0); ctx.moveTo(12, 0); ctx.lineTo(16, 0);
      ctx.moveTo(0, -16); ctx.lineTo(0, -12); ctx.moveTo(0, 12); ctx.lineTo(0, 16);
      ctx.stroke(); ctx.restore();
    }
  }

  function drawGround() {
    const y0 = H - GROUND, sp = 34, off = scroll % sp;
    const paths = { '#39ff88': new Path2D(), '#a2ff3c': new Path2D() };
    for (let x = -off - sp; x < W + sp; x += sp) {
      const idx = Math.round((x + scroll) / sp), h = hash(idx), hgt = 20 + h * 40;
      const sway = Math.sin(t * 2 + idx) * 6, path = paths[h > 0.5 ? '#39ff88' : '#a2ff3c'];
      path.moveTo(x, y0); path.quadraticCurveTo(x + sway * 0.3 - 6, y0 - hgt * 0.5, x + sway, y0 - hgt);
      if (h > 0.7) { path.moveTo(x + 8, y0); path.quadraticCurveTo(x + 14 - sway * 0.2, y0 - hgt * 0.35, x + 10 - sway * 0.6, y0 - hgt * 0.6); }
    }
    ctx.save(); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.shadowBlur = 8;
    for (const col in paths) { ctx.strokeStyle = col; ctx.shadowColor = col; ctx.stroke(paths[col]); }
    ctx.restore();

    const gr = ctx.createLinearGradient(0, y0, 0, H);
    gr.addColorStop(0, '#0b1236'); gr.addColorStop(1, '#03040f');
    ctx.fillStyle = gr; ctx.fillRect(0, y0, W, GROUND);
    ctx.save(); ctx.shadowColor = '#3cf2ff'; ctx.shadowBlur = 12; ctx.strokeStyle = '#3cf2ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke(); ctx.restore();
    const o1 = scroll % 28, o2 = (scroll * 0.7) % 28;
    ctx.fillStyle = 'rgba(60,242,255,0.28)';
    for (let x = -o1; x < W; x += 28) ctx.fillRect(x, y0 + 16, 10, 2);
    ctx.fillStyle = 'rgba(60,242,255,0.12)';
    for (let x = -o2 + 14; x < W; x += 28) ctx.fillRect(x, y0 + 36, 8, 2);
  }

  function drawFish() {
    ctx.save(); ctx.translate(fish.x, fish.y); ctx.rotate(fish.rot);
    const wig = Math.sin(t * (state === 'play' ? 20 : 8)) * (state === 'dead' || state === 'over' ? 0 : 0.35);
    ctx.lineJoin = 'round';
    ctx.save(); ctx.translate(-15, 0); ctx.rotate(wig);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-14, -11); ctx.lineTo(-9, 0); ctx.lineTo(-14, 11); ctx.closePath();
    ctx.fillStyle = 'rgba(255,138,61,0.3)'; ctx.fill();
    ctx.shadowColor = '#ff8a3d'; ctx.shadowBlur = 12; ctx.strokeStyle = '#ff9a4d'; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(-5, -10); ctx.quadraticCurveTo(1, -21, 9, -9);
    ctx.save(); ctx.shadowColor = '#ff8a3d'; ctx.shadowBlur = 10; ctx.strokeStyle = '#ff9a4d'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    const gr = ctx.createLinearGradient(0, -12, 0, 12);
    gr.addColorStop(0, 'rgba(255,210,63,0.45)'); gr.addColorStop(1, 'rgba(255,120,40,0.2)');
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 12, 0, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill();
    ctx.save(); ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 16; ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
    ctx.strokeStyle = 'rgba(255,240,180,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-3, 0, 9, -1.1, 1.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, 4); ctx.quadraticCurveTo(-8, 10, -12, 7); ctx.strokeStyle = 'rgba(255,154,77,0.8)'; ctx.stroke();
    if (state === 'dead' || state === 'over') {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.beginPath();
      ctx.moveTo(5.5, -5.5); ctx.lineTo(10.5, -0.5); ctx.moveTo(10.5, -5.5); ctx.lineTo(5.5, -0.5); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -3, 4, 0, 7); ctx.fill();
      ctx.fillStyle = '#0a1030'; ctx.beginPath(); ctx.arc(9, -3, 2, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of parts) {
      const a = 1 - p.life / p.max;
      if (p.type === 'bubble') {
        ctx.strokeStyle = `rgba(170,240,255,${a * 0.9})`; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
      } else {
        ctx.globalAlpha = a; ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      }
    }
  }

  function glowText(text, x, y, size, col, glow) {
    ctx.save(); ctx.font = `${size}px "Press Start 2P", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = glow; ctx.shadowBlur = 14; ctx.fillStyle = col; ctx.fillText(text, x, y);
    ctx.shadowBlur = 0; ctx.fillText(text, x, y); ctx.restore();
  }

  function drawHUD() {
    for (const p of pops) {
      ctx.globalAlpha = 1 - p.life / 0.8; glowText(p.text, p.x, p.y, 14, '#ffffff', '#7df9ff'); ctx.globalAlpha = 1;
    }
    if (state === 'play' || state === 'dead') glowText(String(score), W / 2, 96, 34, '#ffffff', '#3cf2ff');
    if (state === 'ready') {
      glowText('GET READY', W / 2, H * 0.22, 20, '#ffffff', '#ff2bd6');
      const a = 0.5 + 0.5 * Math.sin(t * 5);
      ctx.globalAlpha = 0.35 + a * 0.65; glowText('TAP TO SWIM', W / 2, fish.y + 84, 13, '#ffffff', '#3cf2ff'); ctx.globalAlpha = 1;
      ctx.strokeStyle = `rgba(60,242,255,${0.6 - (t % 1) * 0.6})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(fish.x, fish.y, 22 + (t % 1) * 22, 0, 7); ctx.stroke();
    }
  }

  function render() {
    const k = cv.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a1a4a'); g.addColorStop(0.55, '#060b2a'); g.addColorStop(1, '#02030f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawRays(); drawPlankton(); drawFarReef(); drawPipes(); drawPearls(); drawGround();
    drawParticles(); drawFish(); drawHUD();
    if (flash > 0) { ctx.setTransform(k, 0, 0, k, 0, 0); ctx.fillStyle = `rgba(255,255,255,${flash * 0.55})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }
  // ---------- Install (PWA) ----------
  const installBtn = $('installBtn'), iosHint = $('iosHint');
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt = e; installBtn.classList.remove('hidden');
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) {}
    deferredPrompt = null; installBtn.classList.add('hidden');
  });
  window.addEventListener('appinstalled', () => { installBtn.classList.add('hidden'); deferredPrompt = null; });
  if (isIOS && !isStandalone) iosHint.classList.remove('hidden');
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }

  resize(); reset(); setState('menu');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
